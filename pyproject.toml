[build-system]
requires = ["uv_build >= 0.12.0, <0.13.0"]
build-backend = "uv_build"

[project]
name = "genreguru"
version = "0.1.0"
authors = [
    { name="Ahmed Al-Hayali" }
]
description = "A greenfield, agent-driven, recreation of GenreGuru for music feature-engineering and recommendation."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
]
license = "AGPL-3.0-only"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "django>=6.1",
    "httpx>=0.28.1",
    "hydra-core>=1.4.0.dev8",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "omegaconf>=2.4.0.dev15",
    "psycopg[binary]>=3.3.4",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "sqlalchemy>=2.0.52",
]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"

[project.optional-dependencies]
# uv add [package name] --optional dev
dev = [
    "bandit>=1.9.4",
    "factory-boy>=3.3.3",
    "pdoc>=16.0.0",
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15.1",
    "radon>=6.0.1",
    "ruff>=0.16.3",
    "ty>=0.0.65",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
# Same as Black.
line-length = 88
indent-width = 4


[tool.ruff.lint]
# Enable common linting rules
select = [
    "B",
    "C",
    "C4",       # flake8-comprehensions
    "D",        # pydocstyle
    "E",
    "F",
    "I",
    "N",
    "Q",
    "SIM",
    "UP",
    "W",
]

ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D100", "D104"]
"frontend/genreguru_web/settings/*.py" = ["F401", "F403", "F405"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.src]
include = [
    "src",
    "tests",
    "frontend",
]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
division-by-zero = "ignore"
possibly-missing-import = "warn"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "genreguru_web.settings.test"
testpaths = ["tests"]
pythonpath = ["frontend", "src"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
