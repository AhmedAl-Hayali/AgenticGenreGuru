[build-system]
requires = ["uv_build >= 0.12.0, <0.13.0"]
build-backend = "uv_build"

[project]
name = "genreguru"
version = "0.1.0"
authors = [
    { name="Ahmed Al-Hayali" }
]
description = "A greenfield, agent-driven, recreation of GenreGuru for music feature-engineering and recommendation."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "hydra-core>=1.3.4",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "scipy>=1.18.0",
]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"

[project.optional-dependencies]
# uv add [package name] --optional dev
dev = [
    "pdoc>=16.0.0",
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "ty>=0.0.65",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
# Same as Black.
line-length = 88
indent-width = 4


[tool.ruff.lint]
# Enable common linting rules
select = [
    "B",
    "C",
    "C4",       # flake8-comprehensions
    "E",
    "F",
    "I",
    "N",
    "Q",
    "SIM",
    "UP",
    "W",
]

ignore = [
    "E501",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.src]
include = [
    "src",
    "tests",
]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
division-by-zero = "ignore"
possibly-missing-import = "warn"
