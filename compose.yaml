services:
  db:
    image: postgres:18
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      secrets:
        - db_user
        - db_password
        - db_host
        - db_port
        - django_secret_key
        - django_allowed_hosts
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      init_db:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - certs:/certs
    command: gunicorn genreguru_web.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  reverse-proxy:
    image: nginx:stable
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./config/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy

  backup:
    image: postgres:18
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pg_dump -Fc > /backups/$(date +%Y%m%d_%H%M%S).dump"

  init_db:
    build:
      context: .
      secrets:
        - db_user
        - db_password
        - db_host
        - db_port
        - django_secret_key
        - django_allowed_hosts
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    command: python -m genreguru.db.init_db db=prod logging=prod django=prod

volumes:
  pgdata:
  certs:
  backups:

secrets:
  db_user:
    environment: DB_USER
  db_password:
    environment: DB_PASSWORD
  db_host:
    environment: DB_HOST
  db_port:
    environment: DB_PORT
  django_secret_key:
    environment: DJANGO_SECRET_KEY
  django_allowed_hosts:
    environment: DJANGO_ALLOWED_HOSTS
