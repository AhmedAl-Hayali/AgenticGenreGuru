version: 1
disable_existing_loggers: false
level: DEBUG
rich: true
formatters:
  console:
    format: "%(levelname)s %(name)s %(message)s"
  json:
    class: genreguru.gglogging.JsonFormatter
filters:
  non_error:
    (): genreguru.gglogging.NonErrorFilter
handlers:
  stdout:
    class: genreguru.gglogging.RichStreamHandler
    level: DEBUG
    stream: ext://sys.stdout
    filters: [non_error]
    rich_tracebacks: true
    tracebacks_suppress: [django]
    markup: false
  stderr:
    class: genreguru.gglogging.RichStreamHandler
    level: ERROR
    stream: ext://sys.stderr
    rich_tracebacks: true
    tracebacks_suppress: [django]
    markup: false
  file_all:
    class: genreguru.gglogging.SafeRotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/genreguru.log.jsonl
    maxBytes: 10485760
    backupCount: 10
    encoding: utf-8
    delay: true
root:
  level: DEBUG
  handlers: [stdout, stderr, file_all]
loggers:
  httpx:
    level: WARNING
    handlers: []
  urllib3:
    level: WARNING
    handlers: []
  numba.core.byteflow:
    level: WARNING
    handlers: []
  numba.core.interpreter:
    level: WARNING
    handlers: []
