name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genreguru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DIALECT: postgresql
      DB_DRIVER: psycopg
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: genreguru
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: python setup
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: uv install
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: "0.12.0"

      - name: project install
        run: uv sync --all-extras --dev

      - name: Append to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/frontend" >> $GITHUB_ENV

      - name: run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: node setup
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: build + lint + format + typecheck + test
        run: npm run check

      - name: coverage
        run: npm run test:coverage

      - name: upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error