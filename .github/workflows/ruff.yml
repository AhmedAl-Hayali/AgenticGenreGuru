name: Ruff
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v7.0.0
      
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.0"
      - run: ruff check --fix
      - run: ruff format --diff
